[tool.poetry]
name = "alphalab-backend"
version = "0.1.0"
description = "AlphaLab Financial Intelligence Platform — backend"
authors = ["AlphaLab"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
pydantic = ">=2.8"
pydantic-settings = ">=2.4"
sqlalchemy = { extras = ["asyncio"], version = ">=2.0.30" }
asyncpg = ">=0.29"
alembic = ">=1.13"
structlog = ">=24.1"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.24"
httpx = ">=0.27"
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
